<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogville Reality</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <nav class="navbar">
                <a href="#" class="nav-item">
                    <img src="casa.png" alt="Acasa" class="nav-icon">
                    <span>Home</span>
                </a>
                <a href="#" class="nav-item">
                    <img src="agenda.png" alt="Contact" class="nav-icon">
                    <span>Contact</span>
                </a>
                <a href="#" class="nav-item">
                    <img src="despre.png" alt="Despre" class="nav-icon">
                    <span>Despre</span>
                </a>
            </nav>
            
            <div class="header-decoration">
                <div class="title-container">
                    <h1>Prima ta locuinta cu o broscuta</h1>
                </div>
            </div>
            
            <img src="broasca alea alea.png" alt="Logo Broscuta" class="large-logo">
        </header>

        <main>
            <section class="contact-form-section">
                <form class="contact-form">
                    <div class="inputs-grid">
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="text" placeholder="Numele tau aici...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="text" placeholder="Prenumele tau aici...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="text" placeholder="Casa care o vrei...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="text" placeholder="Judetul dorit...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="text" placeholder="Orasul dorit...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="text" placeholder="Sectorul aici...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="tel" placeholder="Nr de telefon...">
                        </div>
                        <div class="input-container">
                            <img src="broasca alea alea.png" alt="Icon" class="form-icon">
                            <input type="tel" placeholder="Alte detalii...">
                        </div>
                    </div>
                    <button type="submit" class="submit-button">Submit</button>
                </form>
            </section>
            
            <hr class="section-divider">
            
            <section class="listings-section">
                <div class="listings-container">
                    <div class="listing-card">
                        <img src="broasca cu casa.png" alt="Broasca cu casa">
                    </div>
                    <div class="listing-card">
                        <img src="casa pe lac.png" alt="Casa pe lac">
                    </div>
                    <div class="listing-card">
                        <img src="vila.png" alt="Palat broscuta">
                    </div>
                </div>
            </section>
            
            <hr class="section-divider">
            
            <section class="types-section">
                <h3>Tipuri de locuinte:</h3>
                <ul>
                    <li>Pe lac</li>
                    <li>In mlastina</li>
                    <li>In rau de munte</li>
                    <li>La muzeu</li>
                    <li>Intr-o balta de pescuit</li>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
